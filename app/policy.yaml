# If a request matches here, allow immediately and skip blacklist checks
whitelist_domains:
	- 'twitch.tv'
	- 'static-cdn.jtvnw.net'
	- 'google.com'
	- 'apple.com'
	- 'cloudpanel.forum'
	- '^rr[0-9]'

whitelist_keywords:
	- '/login'

# If not matched by whitelist, evaluate blacklist rules below
blacklist_domains:
	- 'googleadservices.com' # Ad redirect domain
	- 'adservice.google.com'
	- 'booking.com' # Direct block
	- 'doubleclick.net'
	- 'googlesyndication.com'
	- 'googlevideo.com'
	- 'suggestqueries.google.com'
	- '^rkv'
	- 'tagmanager'
	- 'ads'
	- 'analytic'
	- 'advertis'
	- '^signaler'

blacklist_keywords:
	- 'aclk'
	- 'signaler'
	- 'ptracking' # Common YouTube ad click tracking parameter
	- 'adunit'
	- 'ad_type'
	- 'pbg_data'
	- 'booking' # Block when keyword appears in ad-related URLs
	- 'clickserve'
	- 'googleadservices'
	- 'log_event'
	- 'ad_status.'
	- 'ads'
	- 'adv'
	- 'activeview'
	- 'metrics'
	- 'analytic'
	- 'sponsor'
	- '\b(ad[a-z])\.'
	- '/stat'
	- 'track'
	- 'watchtime'
	- 'interac'
