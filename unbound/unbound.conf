server:
    # Network interfaces
    interface: 0.0.0.0
    interface: ::0

    # Specifica esplicitamente le porte TLS
    interface: 0.0.0.0@853
    interface: ::0@853
    
    port: 53
    tls-port: 853

    # Permetti la subnet VPN (importante per i client IKEv2)
    access-control: 10.10.10.0/24 allow

    # Certificati TLS per DoT – generati da bootstrap.sh in base a TLS_MODE
    #   selfsigned  → self-signed in ./ssl-certificates/
    #   letsencrypt → Let's Encrypt via certbot standalone
    #   cloudpanel  → gestiti da CloudPanel / Nginx
    # I path vengono sovrascritti automaticamente dal bootstrap; NON editare a mano.
    tls-service-key: "{{TLS_SERVICE_KEY}}"
    tls-service-pem: "{{TLS_SERVICE_PEM}}"

    # Access control - restrict to localhost by default + aperto per DoT
    access-control: 127.0.0.0/8 allow
    access-control: ::1/128 allow
    access-control: 0.0.0.0/0 allow   # Aperto per DoT pubblico (se vuoi limitare, commenta)
    access-control: ::/0 allow

    # Run as unprivileged user after binding to port 53
    username: "unbound"
    directory: "/etc/unbound"
    chroot: ""

    # Logging
    verbosity: 1
    log-queries: no
    log-replies: no
    log-tag-queryreply: no
    log-local-actions: no
    logfile: ""
    use-syslog: yes

    # Performance tuning – ottimizzato per 4 core / 4 GB RAM
    num-threads: 4  # = numero di core fisici → massimo parallelismo senza overhead eccessivo
    msg-cache-slabs: 4    # power-of-2 vicino a num-threads (riduce lock contention)
    rrset-cache-slabs: 4
    infra-cache-slabs: 4
    key-cache-slabs: 4

    # Cache sizes – circa 1.8–2 GB totali (sicuro sotto il 50–55% della RAM totale)
    msg-cache-size: 128m    # query in flight + risposte piccole → 128–256m ok
    rrset-cache-size: 512m   # RRset è il più usato → raddoppia msg-cache (regola NLnet Labs)
    key-cache-size: 64m           # DNSSEC keys → 32–128m sufficiente per resolver pubblico
    neg-cache-size: 32m          # Negative caching → 16–64m per DoT/Do53 misto

    # Socket handling – valori realistici per VPS 4 GB
    so-rcvbuf: 2m             # 2 MB invece di 4 MB → kernel concede più facilmente
    so-sndbuf: 2m
    so-reuseport: yes           # essenziale con multi-thread
    outgoing-range: 4096          # 8192 è aggressivo per 4 GB; 4096–6144 più sicuro
    num-queries-per-thread: 512    # default 4096 è troppo per 4 GB con DoT; 512–1024 meglio

    # Privacy and security
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-referral-path: yes
    harden-algo-downgrade: yes
    use-caps-for-id: yes
    qname-minimisation: yes
    qname-minimisation-strict: no

    # DNSSEC validation - the core of this configuration
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    val-clean-additional: yes
    val-permissive-mode: no
    val-log-level: 1

    # Root hints for bootstrapping
    root-hints: "/usr/share/dns/root.hints"

    # Prefetching for performance
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-client-timeout: 1800

    # Module configuration - validator must be present for DNSSEC
    module-config: "validator iterator"
    
    # Blacklist Personale (se vuoi blocchi ads / tracker)
    include: "/etc/unbound/blacklist.conf"

# Remote control for management (opzionale, utile per unbound-control)
remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-port: 8953
    server-key-file: "/etc/unbound/unbound_server.key"
    server-cert-file: "/etc/unbound/unbound_server.pem"
    control-key-file: "/etc/unbound/unbound_control.key"
    control-cert-file: "/etc/unbound/unbound_control.pem"