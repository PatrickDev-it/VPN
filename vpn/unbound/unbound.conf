server:
    # Network interfaces
    interface: 0.0.0.0
    interface: ::0

    # Explicitly define TLS listening interfaces
    interface: 0.0.0.0@853
    interface: ::0@853
    
    port: 53
    tls-port: 853

    # Allow VPN subnet (important for IKEv2 clients)
    access-control: 10.10.10.0/24 allow

    # DoT TLS certificates - managed by bootstrap.sh based on TLS_MODE
    #   selfsigned  → self-signed in ./ssl-certificates/
    #   letsencrypt → Let's Encrypt via certbot standalone
    #   cloudpanel  → managed by CloudPanel / Nginx
    # Paths are automatically replaced by bootstrap; do not edit manually.
    tls-service-key: "{{TLS_SERVICE_KEY}}"
    tls-service-pem: "{{TLS_SERVICE_PEM}}"

    # Access control - local by default plus optional public DoT
    access-control: 127.0.0.0/8 allow
    access-control: ::1/128 allow
    access-control: 0.0.0.0/0 allow   # Public DoT enabled (comment to restrict)
    access-control: ::/0 allow

    # Run as unprivileged user after binding to port 53
    username: "unbound"
    directory: "/etc/unbound"
    chroot: ""

    # Logging
    verbosity: 1
    log-queries: no
    log-replies: no
    log-tag-queryreply: no
    log-local-actions: no
    logfile: ""
    # Containers expose service logs through stdout/stderr; no syslog daemon is present.
    use-syslog: no

    # Performance tuning - optimized for 4 cores / 4 GB RAM
    num-threads: 4  # equals physical core count for balanced parallelism
    msg-cache-slabs: 4    # power-of-2 near num-threads reduces lock contention
    rrset-cache-slabs: 4
    infra-cache-slabs: 4
    key-cache-slabs: 4

    # Cache sizes - roughly 1.8–2 GB total (safe below ~50–55% of system RAM)
    msg-cache-size: 128m    # in-flight queries + smaller responses
    rrset-cache-size: 512m   # RRset cache commonly benefits from a larger ratio
    key-cache-size: 64m           # DNSSEC key cache for public resolver workloads
    neg-cache-size: 32m          # Negative response caching for mixed Do53/DoT traffic

    # Socket handling - practical values for a 4 GB VPS
    so-rcvbuf: 2m             # smaller buffers are usually easier for kernel allocation
    so-sndbuf: 2m
    so-reuseport: yes           # recommended with multithreading
    outgoing-range: 4096          # conservative and stable for 4 GB class instances
    num-queries-per-thread: 512    # lower value prevents memory pressure with DoT

    # Privacy and security
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-referral-path: yes
    harden-algo-downgrade: yes
    use-caps-for-id: yes
    qname-minimisation: yes
    qname-minimisation-strict: no

    # DNSSEC validation - the core of this configuration
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    val-clean-additional: yes
    val-permissive-mode: no
    val-log-level: 1

    # Root hints for bootstrapping
    root-hints: "/usr/share/dns/root.hints"

    # Prefetching for performance
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    serve-expired-ttl: 86400
    serve-expired-client-timeout: 1800

    # Module configuration - validator must be present for DNSSEC
    module-config: "validator iterator"
    
    # Local blocklist include (ads / trackers)
    include: "/etc/unbound/blacklist.conf"

# Remote control (optional, useful for unbound-control)
remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-port: 8953
    # The control socket never leaves the container network namespace.
    # Avoid a runtime dependency on generated control certificates.
    control-use-cert: no
