name: CD — Deploy to VPS

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Only one deploy at a time
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            vpn/requirements.txt
            vpn/requirements-dev.txt
            vpn/requirements-security-overrides.txt

      - name: Install dependencies
        run: |
          pip install -r vpn/requirements.txt -r vpn/requirements-dev.txt
          pip install --no-deps --upgrade -r vpn/requirements-security-overrides.txt

      - name: Run static analysis and tests
        run: |
          ruff check vpn
          pytest vpn/tests --tb=short -q

      - name: Validate Compose contract
        working-directory: vpn
        run: docker compose --env-file ../.env.example config -q

  # ---------------------------------------------------------------------------
  # Publish Docker images to GitHub Container Registry (GHCR)
  # ---------------------------------------------------------------------------
  publish:
    name: Publish images to GHCR
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/mitmproxy
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push mitmproxy image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./vpn
          file: ./vpn/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Deploy to production VPS via SSH
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: publish
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd ${{ secrets.VPS_PROJECT_PATH }}

            echo "=== Checking out the released revision ==="
            git fetch --prune --tags origin
            git checkout --force --detach ${{ github.sha }}
            cd vpn

            echo "=== Logging into GHCR ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin

            IMAGE_NAME=$(printf '%s' "ghcr.io/${{ github.repository }}/mitmproxy" | tr '[:upper:]' '[:lower:]')
            export MITMPROXY_IMAGE="${IMAGE_NAME}@${{ needs.publish.outputs.image_digest }}"

            echo "=== Pulling immutable image ==="
            docker compose --env-file ../.env pull mitmproxy

            echo "=== Restarting stack ==="
            docker compose --env-file ../.env up -d --no-build --remove-orphans

            echo "=== Pruning dangling images ==="
            docker image prune -f

            echo "=== Verifying mitmproxy is running ==="
            docker compose --env-file ../.env ps --status running --services | grep -qx "mitmproxy" || \
              (docker compose --env-file ../.env logs --tail=50 mitmproxy && exit 1)

            echo "=== Deploy completed ==="

      - name: Notify deployment status
        if: always()
        run: |
          STATUS="${{ job.status }}"
          echo "Deployment status: $STATUS"
          echo "Image tag: ${{ needs.publish.outputs.image_tag }}"
          echo "Deployed by: ${{ github.actor }}"
          echo "Commit: ${{ github.sha }}"
