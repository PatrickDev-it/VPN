name: CI

on:
  workflow_call:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint and static analysis
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vpn/requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r vpn/requirements-dev.txt

      - name: Run ruff
        run: ruff check vpn

  # ---------------------------------------------------------------------------
  # Unit and integration tests
  # ---------------------------------------------------------------------------
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            vpn/requirements.txt
            vpn/requirements-dev.txt
            vpn/requirements-security-overrides.txt

      - name: Install all dependencies
        run: |
          pip install -r vpn/requirements.txt -r vpn/requirements-dev.txt
          pip install --no-deps --upgrade -r vpn/requirements-security-overrides.txt

      - name: Run pytest
        run: pytest vpn/tests --tb=short -q

  # ---------------------------------------------------------------------------
  # Docker Compose configuration validation
  # ---------------------------------------------------------------------------
  compose-validate:
    name: Compose config validation
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Validate docker-compose.yml
        working-directory: vpn
        run: docker compose --env-file ../.env.example config -q

  # ---------------------------------------------------------------------------
  # Build all Docker images
  # ---------------------------------------------------------------------------
  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [test, compose-validate]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build mitmproxy image
        uses: docker/build-push-action@v7
        with:
          context: ./vpn
          file: ./vpn/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build unbound image
        uses: docker/build-push-action@v7
        with:
          context: ./vpn
          file: ./vpn/services/unbound/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build privoxy image
        uses: docker/build-push-action@v7
        with:
          context: ./vpn
          file: ./vpn/services/privoxy/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build tor image
        uses: docker/build-push-action@v7
        with:
          context: ./vpn
          file: ./vpn/services/tor/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Smoke test: start stack, verify mitmproxy is reachable, tear down
  # ---------------------------------------------------------------------------
  smoke:
    name: Smoke test (stack up)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Create minimal users.yaml for smoke test
        working-directory: vpn
        run: |
          cat > app/users.yaml <<'EOF'
          users:
            ci_user:
              password_sha256: "8131fc3d01054c8f78377f86b3a5f8534a93d1c1710a7c24f9354bba465b74a6"
              token: "ci-smoke-token-00000000"
          EOF

      - name: Prepare deterministic TLS fixture
        working-directory: vpn
        run: |
          mkdir -p ssl-certificates
          openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes \
            -keyout ssl-certificates/server.key \
            -out ssl-certificates/server.crt \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          sed -i \
            -e 's|{{TLS_SERVICE_KEY}}|/etc/nginx/ssl-certificates/server.key|g' \
            -e 's|{{TLS_SERVICE_PEM}}|/etc/nginx/ssl-certificates/server.crt|g' \
            unbound/unbound.conf
          ! grep -q '{{TLS_SERVICE_\(KEY\|PEM\)}}' unbound/unbound.conf

      - name: Start stack
        working-directory: vpn
        run: docker compose --env-file ../.env.example up -d --build

      - name: Wait for proxy authentication boundary
        working-directory: vpn
        run: |
          for i in $(seq 1 30); do
            status=$(curl -s --max-time 2 -x http://localhost:8080 \
              http://example.com -o /dev/null -w "%{http_code}" || true)
            if [ "$status" = "407" ]; then
              echo "Authentication boundary ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Authentication boundary not ready after 30s"
          docker compose --env-file ../.env.example ps
          docker compose --env-file ../.env.example logs
          exit 1

      - name: Verify authenticated request is accepted
        working-directory: vpn
        run: |
          status=$(curl -s --max-time 5 -x http://localhost:8080 \
            -U 'ci_user:ci_pass' http://example.com -o /dev/null -w "%{http_code}" || true)
          [ "$status" != "000" ] && [ "$status" != "407" ] || \
            (echo "Authenticated request was not accepted; got $status"; exit 1)

      - name: Verify internal service contracts
        working-directory: vpn
        run: |
          running=$(docker compose --env-file ../.env.example ps --status running --services)
          for service in mitmproxy privoxy tor unbound; do
            echo "$running" | grep -qx "$service" || \
              (echo "$service is not running"; docker compose --env-file ../.env.example logs "$service"; exit 1)
          done
          docker compose --env-file ../.env.example exec -T mitmproxy \
            python -c "import socket; socket.create_connection(('privoxy', 8118), 5).close()"
          timeout 10 openssl s_client -connect 127.0.0.1:853 -servername localhost \
            -brief </dev/null 2>&1 | grep -q 'Protocol version: TLSv1\.[23]'

      - name: Tear down stack
        if: always()
        working-directory: vpn
        run: docker compose --env-file ../.env.example down -v
